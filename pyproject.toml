[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smlgw"
version = "1.0.0"
description = "Smart meter (SML/OBIS) to MQTT gateway with a web configuration UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Philipp Mundhenk", email = "philipp@mundhenk.org" }]
# Deliberately a pure-Python dependency set: no pydantic-core/uvloop/httptools
# Rust or C builds, so `pip install` is fast even on an ARMv6 board (Raspberry
# Pi 1) with only source distributions available. The web layer runs on
# Starlette (what FastAPI is built on) served by plain uvicorn.
dependencies = [
    "pyserial>=3.5",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
smlgw = "smlgw.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smlgw = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
