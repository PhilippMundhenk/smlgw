services:
  smlgw:
    build: .
    image: smlgw:latest
    container_name: smlgw
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config
    # Pass through the meter's serial adapters. Adjust to your host devices
    # (see the device list in the web UI, `smlgw ports`, or
    # `ls -l /dev/serial/by-id`). With several readers, pin each meter with
    # port: usb:serial=... so a swapped ttyUSB0/ttyUSB1 cannot mix them up.
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    # Or map each reader by ID under a fixed name and use that name as port:
    #   - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A50285BI-if00-port0:/dev/ttyHeating"
    # For hot-plug without a restart, drop `devices:`, add "/dev:/dev" to
    # `volumes:` above and allow the USB serial device classes:
    # device_cgroup_rules: ["c 188:* rmw", "c 166:* rmw"]   # ttyUSB*, ttyACM*

  # Optional local broker for testing; point mqtt.host at "mosquitto".
  # mosquitto:
  #   image: eclipse-mosquitto:2
  #   restart: unless-stopped
  #   ports: ["1883:1883"]
  #   volumes:
  #     - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
